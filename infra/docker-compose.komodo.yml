# Independent Komodo control plane for fresh MzansiCloud Box deployments.
# Existing VPS-1 Komodo is adopted without replacement.
name: mzansi-komodo
services:
  mongo:
    image: mongo:8.0
    command: --quiet --wiredTigerCacheSizeGB 0.25
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DATABASE_USERNAME:?required}
      MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DATABASE_PASSWORD:?required}
  core:
    image: ghcr.io/moghtech/komodo-core:2
    init: true
    restart: unless-stopped
    depends_on: [mongo]
    ports:
      - "127.0.0.1:9120:9120"
    env_file:
      - ${MZC_KOMODO_ENV_FILE:?absolute path required}
    environment:
      KOMODO_DATABASE_ADDRESS: mongo:27017
    volumes:
      - keys:/config/keys
      - komodo-backups:/backups
  periphery:
    image: ghcr.io/moghtech/komodo-periphery:2
    init: true
    restart: unless-stopped
    depends_on: [core]
    env_file:
      - ${MZC_KOMODO_ENV_FILE:?absolute path required}
    volumes:
      - keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc:ro
      - ${MZC_KOMODO_ROOT_DIR:-/etc/komodo}:/etc/komodo
volumes:
  mongo-data:
  mongo-config:
  keys:
  komodo-backups:
